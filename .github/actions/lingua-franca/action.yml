name: Set up build environment
description: Set up Java and cache the compiled LFC + Gradle dependencies.

runs:
  using: "composite"
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - name: Cache Xtext ANTLR generator
      uses: actions/cache@v4
      with:
        path: ulf/core/.antlr-generator-3.2.0-patch.jar
        key: antlr-generator-3.2.0-patch
    - name: Cache LFC build + Gradle
      uses: actions/cache@v4
      with:
        path: |
          ulf/build
          ulf/**/build
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ulf-${{ runner.os }}-${{ hashFiles('ulf/**/*.kt', 'ulf/**/*.java', 'ulf/**/*.gradle*', 'ulf/gradle/wrapper/**') }}
        restore-keys: |
          ulf-${{ runner.os }}-
