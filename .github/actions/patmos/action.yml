name: Install Patmos and dependencies (Linux only)
description: Install Patmos and dependencies (Linux only)
inputs:
  clone-template:
    description: "Clone ulf-patmos-template next to reactor-uc"
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Install required packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y git openjdk-11-jdk cmake make g++ texinfo flex bison \
          subversion libelf-dev graphviz libboost-dev libboost-program-options-dev ruby-full \
          liblpsolve55-dev zlib1g-dev gtkwave gtkterm scala autoconf libfl2 expect verilator curl chrpath

    - name: Install sbt
      uses: sbt/setup-sbt@v1

    - name: Clone and build Patmos
      shell: bash
      run: |
        export PATH=$PATH:$HOME/t-crest/local/bin
        echo "$HOME/t-crest/local/bin" >> $GITHUB_PATH
        echo $PATH
        mkdir ~/t-crest
        cd ~/t-crest
        git clone https://github.com/t-crest/patmos-misc.git misc
        ./misc/build.sh -q

    - name: Verify Patmos installation
      shell: bash
      run: |
        patmos-clang --version
        if [ $? -ne 0 ]; then
          echo "Patmos installation failed"
          exit 1
        fi

    - name: Clone template
      shell: bash
      run: |
        if [ "${{ inputs.clone-template }}" = "true" ]; then
          echo "Cloning ulf-patmos-template (reactor-uc branch) as sibling of reactor-uc..."
          # Clone one level up from GITHUB_WORKSPACE (which is reactor-uc/)
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth=1 https://github.com/lf-lang/ulf-patmos-template.git ulf-patmos-template
          if [ ! -f "$GITHUB_WORKSPACE/../ulf-patmos-template/MakefileTemplate" ]; then
            echo "lfc: error: Patmos template not found at: $GITHUB_WORKSPACE/../ulf-patmos-template/MakefileTemplate";
            exit 1;
          fi
          echo "Template cloned successfully at $GITHUB_WORKSPACE/../ulf-patmos-template"
        fi
