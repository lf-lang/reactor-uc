# Kconfig shared by the sender and the receiver federate (see prj.conf of each for the IP address)
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_ASSERT=y

# Networking: both federates are attached to TAP interfaces of the host, which run.sh connects with a bridge
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_ARP=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_DRIVERS=y
CONFIG_ETH_NATIVE_TAP=y
# The (fake) entropy source of native_sim gives both federates the same random MAC address.
# Without random MACs, run.sh sets a distinct one per federate with --mac-addr.
CONFIG_ETH_NATIVE_TAP_RANDOM_MAC=n
CONFIG_POSIX_API=n
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

# Zephyr CoAP stack as required by the CoAP network channel (see coap_udp_ip_channel.h)
CONFIG_COAP=y
CONFIG_COAP_SERVER=y
CONFIG_COAP_CLIENT=y
CONFIG_COAP_CLIENT_MESSAGE_SIZE=880
CONFIG_COAP_SERVER_MESSAGE_SIZE=920
CONFIG_COAP_CLIENT_MAX_REQUESTS=1
CONFIG_COAP_CLIENT_MAX_INSTANCES=2
CONFIG_COAP_SERVICE_PENDING_MESSAGES=1
CONFIG_COAP_SERVER_PENDING_ALLOCATOR_NONE=y
CONFIG_COAP_SERVER_WELL_KNOWN_CORE=n
CONFIG_COAP_SERVER_STACK_SIZE=8192
CONFIG_COAP_CLIENT_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
