# Unity and reactor-uc
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_ASSERT=y

# Networking: client and server talk to each other over the loopback interface (127.0.0.1)
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y
# Only the loopback interface (no TAP interface on the host needed)
CONFIG_ETH_NATIVE_TAP=n
CONFIG_POSIX_API=n

# Zephyr CoAP stack as required by the CoAP network channel (see coap_udp_ip_channel.h)
CONFIG_COAP=y
CONFIG_COAP_SERVER=y
CONFIG_COAP_CLIENT=y
CONFIG_COAP_CLIENT_MESSAGE_SIZE=880
CONFIG_COAP_SERVER_MESSAGE_SIZE=920
CONFIG_COAP_CLIENT_MAX_REQUESTS=1
CONFIG_COAP_CLIENT_MAX_INSTANCES=2
CONFIG_COAP_SERVICE_PENDING_MESSAGES=1
CONFIG_COAP_SERVER_PENDING_ALLOCATOR_NONE=y
CONFIG_COAP_SERVER_WELL_KNOWN_CORE=n
CONFIG_COAP_SERVER_STACK_SIZE=4096
CONFIG_COAP_CLIENT_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
